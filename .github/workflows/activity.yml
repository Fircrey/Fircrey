# Genera a diario la serpiente de contribuciones y la tarjeta de estadísticas,
# y las publica en la rama `output`. El README las carga desde ahí, así el perfil
# no depende de servicios externos.
name: Actividad del perfil

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC, de madrugada en Bogotá
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/activity.yml", "scripts/stats.mjs", "scripts/templates/**"]
  pull_request:
    paths: [".github/workflows/activity.yml", "scripts/stats.mjs", "scripts/templates/**"]

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Antes que snk: su contenedor crea dist/ como root y después no se podría escribir.
      - name: Tarjeta de estadísticas
        run: node scripts/stats.mjs dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Serpiente de contribuciones
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#22C3D6&color_dots=#12293A,#0E4A5A,#13738A,#1A9FB4,#22C3D6
            dist/snake-light.svg?color_snake=#0B1E2B&color_dots=#E3EBEF,#B5E6ED,#7FD3DF,#3FBCCD,#08707E

      # En los PR solo se comprueba que todo se genera; publicar es cosa de main.
      - name: Publicar en la rama output
        if: github.event_name != 'pull_request'
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: "Actualiza la actividad del perfil"
        env:
          GITHUB_TOKEN: ${{ github.token }}
